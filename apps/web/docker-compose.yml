services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: nexo_local
      POSTGRES_DB: nexochat
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo -d nexochat"]
      interval: 5s
      retries: 10
volumes:
  postgres-data:
